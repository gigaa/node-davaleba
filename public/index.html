<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ოთახის ჩათი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E6ECEF; --panel: #FFFFFF; --ink: #17233B; --muted: #5E6C82;
    --line: #D3DCE3; --accent: #0E6B5C; --accent-ink: #FFFFFF; --error: #B3261E;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Noto Sans Georgian', system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  [hidden] { display: none !important; }
  button, input { font: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* შესვლის ეკრანი */
  #join { min-height: 100%; display: grid; place-items: center; padding: 20px; }
  .card { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { margin: 0 0 22px; color: var(--muted); }
  label { display: block; font-weight: 500; margin: 14px 0 6px; }
  input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: #F8FAFB; color: var(--ink); }
  #code { letter-spacing: .25em; text-transform: uppercase; font-weight: 700; }
  .row { display: flex; gap: 10px; margin-top: 20px; }
  .btn { flex: 1; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--accent); cursor: pointer; font-weight: 500; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; color: var(--accent); }
  #error { min-height: 22px; margin: 12px 0 0; color: var(--error); }

  /* ჩათის ეკრანი */
  #chat { height: 100%; display: grid; grid-template-columns: 240px 1fr; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow: auto; }
  .roomcode { display: flex; align-items: center; gap: 8px; }
  .roomcode b { font-size: 26px; letter-spacing: .18em; }
  .small { padding: 6px 10px; border: 1px solid var(--line); background: transparent; border-radius: 6px; cursor: pointer; color: var(--ink); }
  aside h2 { margin: 0; font-size: 14px; color: var(--muted); font-weight: 500; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  li::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; }
  main { display: flex; flex-direction: column; min-height: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: min(560px, 82%); padding: 9px 13px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .msg .who { font-size: 12px; font-weight: 700; opacity: .75; margin-bottom: 2px; }
  .msg .time { font-size: 11px; opacity: .6; margin-left: 8px; }
  .sys { align-self: center; color: var(--muted); font-size: 13px; }
  form { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--panel); }
  form input { flex: 1; }
  form .btn { flex: 0 0 auto; }
  @media (max-width: 720px) {
    #chat { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; flex-direction: row; flex-wrap: wrap; align-items: center; }
    .roomcode b { font-size: 20px; }
    #users { display: none; }
  }
</style>
</head>
<body>

<section id="join">
  <div class="card">
    <h1>ოთახის ჩათი</h1>
    <p class="sub">შექმენი ახალი ოთახი ან შედი კოდით.</p>
    <label for="name">შენი სახელი</label>
    <input id="name" maxlength="24" autocomplete="nickname">
    <label for="code">ოთახის კოდი</label>
    <input id="code" maxlength="6" placeholder="მაგ. K7M2QX" autocomplete="off">
    <div class="row">
      <button class="btn primary" id="joinBtn">შესვლა კოდით</button>
      <button class="btn ghost" id="createBtn">ახალი ოთახი</button>
    </div>
    <p id="error" role="alert"></p>
  </div>
</section>

<section id="chat" hidden>
  <aside>
    <div>
      <h2>ოთახის კოდი</h2>
      <div class="roomcode"><b id="roomLabel"></b><button class="small" id="copyBtn">კოპირება</button></div>
    </div>
    <div id="users"><h2>ონლაინ</h2><ul id="userList"></ul></div>
    <button class="small" id="leaveBtn">გასვლა</button>
  </aside>
  <main>
    <div id="messages" aria-live="polite"></div>
    <form id="form">
      <input id="text" maxlength="1000" placeholder="დაწერე შეტყობინება" autocomplete="off">
      <button class="btn primary" type="submit">გაგზავნა</button>
    </form>
  </main>
</section>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io(); // იმავე origin-ზე, საიდანაც გვერდია გახსნილი
  const $ = (id) => document.getElementById(id);
  let currentRoom = null;

  const fmt = (t) => new Date(t).toLocaleTimeString('ka-GE', { hour: '2-digit', minute: '2-digit' });

  function enterChat(room) {
    currentRoom = room;
    $('roomLabel').textContent = room;
    $('messages').replaceChildren();
    $('join').hidden = true;
    $('chat').hidden = false;
    $('text').focus();
  }

  function handleAck(res) {
    if (res.ok) enterChat(res.room);
    else $('error').textContent = res.error;
  }

  $('createBtn').onclick = () => {
    $('error').textContent = '';
    socket.emit('createRoom', { name: $('name').value }, handleAck);
  };
  $('joinBtn').onclick = () => {
    $('error').textContent = '';
    if ($('code').value.trim().length < 6) { $('error').textContent = 'კოდი 6 სიმბოლოსგან შედგება'; return; }
    socket.emit('joinRoom', { name: $('name').value, room: $('code').value }, handleAck);
  };

  $('form').onsubmit = (e) => {
    e.preventDefault();
    const text = $('text').value.trim();
    if (!text) return;
    socket.emit('sendMessage', { text });
    $('text').value = '';
  };

  $('leaveBtn').onclick = () => {
    socket.emit('leaveRoom');
    currentRoom = null;
    $('chat').hidden = true;
    $('join').hidden = false;
  };

  $('copyBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(currentRoom); $('copyBtn').textContent = 'დაკოპირდა'; }
    catch { $('copyBtn').textContent = 'ვერ დაკოპირდა'; }
    setTimeout(() => ($('copyBtn').textContent = 'კოპირება'), 1500);
  };

  function addToFeed(el) {
    const box = $('messages');
    const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    box.appendChild(el);
    if (stick) box.scrollTop = box.scrollHeight;
  }

  socket.on('message', (m) => {
    const el = document.createElement('div');
    el.className = 'msg' + (m.senderId === socket.id ? ' me' : '');
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = m.name;
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = fmt(m.time);
    who.appendChild(time);
    const body = document.createElement('div');
    body.textContent = m.text; // textContent — XSS-ისგან დაცვა
    el.append(who, body);
    addToFeed(el);
  });

  socket.on('system', (m) => {
    const el = document.createElement('div');
    el.className = 'sys';
    el.textContent = m.text;
    addToFeed(el);
  });

  socket.on('users', (list) => {
    $('userList').replaceChildren(...list.map((n) => {
      const li = document.createElement('li');
      li.textContent = n;
      return li;
    }));
  });

  // კავშირის გაწყვეტის შემთხვევაში სერვერზე წევრობა იკარგება, ამიტომ ვბრუნდებით შესვლის ეკრანზე
  socket.on('disconnect', () => {
    if (!currentRoom) return;
    currentRoom = null;
    $('chat').hidden = true;
    $('join').hidden = false;
    $('error').textContent = 'კავშირი გაწყდა. შედი ოთახში თავიდან.';
  });
</script>
</body>
</html>
